<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <title>Mission</title>
</head>
<body>
  <div class="cfg">
    <p><a href="index.html">Back</a></p>
    <h1>Effectors</h1>
    <div id="effectors"></div>
    <button type="button" id="add-effector">Add binding</button>

    <h1>Flight states</h1>
    <p>Each transition fires when any OR group is fully true. Comparisons inside a group are all required. The first matching transition is taken. An enabled transition with no comparisons does not fire.</p>
    <div id="states" class="cfg-states"></div>
    <div id="edges"></div>

    <p><button type="button" id="save">Save and restart</button></p>
    <p id="status"></p>
  </div>
  <script src="configurator.js"></script>
</body>
</html>
